; ============================================================================
;  靶车 —— M5Stamp S3 桥接端 (ESP-NOW -> UART)  PlatformIO 工程
;
;  用法 (VSCode + PlatformIO 插件):
;    1. 用 VSCode 打开 firmware/esp32_bridge 这个文件夹
;    2. 环境就是 m5stack-stamps3 (只有一个环境, 不用选)
;    3. Build / Upload / Monitor
;
;  串口监视器波特率 115200 (这是 USB CDC 调试口, 不是接 STM32 的那路)
; ============================================================================

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200

; 共享库: firmware/lib/protocol (三端共用的通信协议)
;         firmware/lib/oled     (128x64 OLED 驱动, 与 STM32 端同一份)
; 用 lib_deps 的本地路径引用比 lib_extra_dirs 更可靠
lib_extra_dirs =
    ${PROJECT_DIR}/../lib
lib_deps =
    ${PROJECT_DIR}/../lib/protocol
    ${PROJECT_DIR}/../lib/oled
lib_ldf_mode = chain

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=0
    ; 源码里有中文, 显式声明输入输出编码, 避免不同编译器按 GBK 解读
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; ---------------- 桥接: M5Stamp S3 (ESP32-S3) ----------------
; 这是本项目唯一的桥接环境。
;
; 曾经这里还有一个 [env:esp32dev] "备选普通 ESP32" 环境, 已经删掉, 原因:
;   1. 普通 ESP32 没有原生 USB, Serial 走 UART0(GPIO1/GPIO3),
;      正好和接 STM32 的串口脚冲突, 那个环境根本跑不起来
;   2. 它缺少 -DARDUINO_USB_CDC_ON_BOOT=1, 行为与 S3 完全不同,
;      谈不上是"同一个固件的备选"
;   3. 点 Upload 时 PlatformIO 会烧所有环境, 多一个不存在的板子
;      就多一条 "FAILED", 纯属干扰
; 如果以后真的换成普通 ESP32 做桥接, 需要同步改 include/app_config.h 里的
; LINK_PIN_TXD/RXD (换成 GPIO16/17 等空闲脚) 并关掉 BRIDGE_DEBUG。
[env:m5stack-stamps3]
board = m5stack-stamps3
upload_speed = 921600
build_flags =
    ${env.build_flags}
    ; 让 USB 口直接出 Serial 打印 (ESP32-S3 原生 USB)
    -DARDUINO_USB_CDC_ON_BOOT=1
