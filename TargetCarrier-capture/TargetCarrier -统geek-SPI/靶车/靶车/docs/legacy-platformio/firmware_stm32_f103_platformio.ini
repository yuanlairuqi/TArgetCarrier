; ============================================================================
;  靶车 —— STM32F103C8T6 控制器  PlatformIO 工程
;
;  用法 (VSCode + PlatformIO 插件):
;    1. 用 VSCode 打开 firmware/stm32_f103 这个文件夹
;    2. 环境 bluepill_f103c8
;    3. Build / Upload
;
;  板卡说明:
;    野火 F103C8T6 核心板 = 标准 STM32F103C8T6 最小系统 (72MHz / 64KB Flash /
;    20KB RAM), 与"蓝板 bluepill"的芯片和引脚完全一致, 直接用 bluepill_f103c8 即可。
; ============================================================================

[platformio]
; ★★★ 这里必须用纯 ASCII 路径, 不是洁癖, 是工具链的硬限制 ★★★
;
; 现象: 构建目录落在中文路径下时, 链接阶段必然失败:
;         arm-none-eabi-ld.exe: cannot open map file
;         C:/Users/zzq/Desktop/靶车/.../firmware.map: No such file or directory
;         collect2.exe: error: ld returned 1 exit status
;
; 已做的对照实验 (同一份代码, 同一套工具链):
;   A. 项目内 .pio, 中文路径, 相对路径        -> 失败
;   B. 项目内 .pio, 中文路径, 绝对路径        -> 失败
;   C. C:/pio_build/ascii                    -> 成功
;   D. C:/Users/zzq/Desktop/靶车/build       -> 失败   (短路径, 但仍含中文)
;   E. 超长纯 ASCII 路径                      -> 成功   (排除"路径太长"这个猜测)
; 结论: 与长度无关, 与路径里有没有非 ASCII 字符 (中文) 直接相关。
;
; 所以: 源码可以放在中文目录, 但 build_dir 指向纯 ASCII 目录。
; 如果你把整个工程挪到纯英文路径 (例如 D:\target-vehicle), 就可以删掉这一行,
; 让 PlatformIO 用默认的 .pio 目录。
build_dir = C:/pio_build/target-vehicle/stm32

[env:bluepill_f103c8]
platform  = ststm32
board     = bluepill_f103c8
framework = arduino

; 共享库: firmware/lib/protocol (三端共用的通信协议)
;         firmware/lib/oled     (128x64 OLED 驱动, 与 ESP32 端同一份)
; 用 ${PROJECT_DIR} 展开成绝对路径, 比相对路径可靠
lib_extra_dirs =
    ${PROJECT_DIR}/../lib
lib_deps =
    ${PROJECT_DIR}/../lib/protocol
    ${PROJECT_DIR}/../lib/oled
lib_ldf_mode = chain

; HSE 8MHz 晶振 -> PLL x9 -> 72MHz (野火核心板板载 8MHz 晶振)
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DHSE_VALUE=8000000U
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

monitor_speed = 115200

; ---------------- 烧录方式 (按你的下载器选一个) ----------------
;   ST-Link:    upload_protocol = stlink      (推荐, 也支持在线调试)
;   J-Link:     upload_protocol = jlink
;   串口 ISP:   upload_protocol = serial       (需要 BOOT0 拉高再上电)
;   DAPLink:    upload_protocol = cmsis-dap
upload_protocol = stlink
debug_tool = stlink
