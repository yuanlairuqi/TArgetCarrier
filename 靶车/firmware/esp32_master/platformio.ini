; ============================================================================
;  靶车 —— ESP32 主机 (ESP-NOW 发射端)  PlatformIO 工程
;
;  用法 (VSCode + PlatformIO 插件):
;    1. 用 VSCode 打开 firmware/esp32_master 这个文件夹
;    2. 环境就是 m5stack-stamps3 (只有一个环境, 不用选)
;    3. PlatformIO 侧边栏 -> Build / Upload / Monitor
;
;  串口监视器波特率 115200 (USB CDC 虚拟串口, 波特率其实不敏感)
;
;  命令行等价:
;    pio run -t upload           ; 编译并烧录
;    pio device monitor          ; 看串口 (Ctrl+C 退出)
; ============================================================================

[env]
platform      = espressif32
framework     = arduino
monitor_speed = 115200

; 共享协议库: firmware/lib/protocol (与桥接端/STM32 端是同一份文件)
; 用 lib_deps 的本地路径引用比 lib_extra_dirs 更可靠
lib_extra_dirs =
    ${PROJECT_DIR}/../lib
lib_deps =
    ${PROJECT_DIR}/../lib/protocol
lib_ldf_mode = chain

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCORE_DEBUG_LEVEL=0
    ; 源码里有中文, 显式声明输入输出编码, 避免不同编译器按 GBK 解读
    -finput-charset=UTF-8
    -fexec-charset=UTF-8

; ---------------- 主机: M5Stamp S3 / ESP32-S3 ----------------
; 你手上只有 ESP32-S3, 所以这里只保留这一个环境。
;
; 曾经这里还有一个 [env:esp32dev] (普通 ESP32) 环境, 已删除, 原因:
;   点 Upload 时 PlatformIO 会烧 ini 里所有环境, 多一个你没有的板子
;   就会多一条 "FAILED", 看着像出错了, 其实另一个环境是成功的。
; 如果以后真要用普通 ESP32 做主机, 补回下面这几行即可:
;     [env:esp32dev]
;     board = esp32dev
;     upload_speed = 921600
;     monitor_filters = esp32_exception_decoder
[env:m5stack-stamps3]
board = m5stack-stamps3
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
